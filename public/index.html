<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食品メディア横断検索</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#222;background:#f6f7f9}
  *{box-sizing:border-box} body{margin:0;background:#f6f7f9}.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 50px}
  h1{font-size:28px;margin:0 0 8px}.lead{color:#666;margin:0 0 22px}.panel{background:#fff;border:1px solid #e2e5e9;border-radius:14px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.04);margin-bottom:18px}
  .searchrow{display:flex;gap:10px}.searchrow input{flex:1;min-width:0;padding:13px 14px;border:1px solid #cfd4da;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#222;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.control label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#555}.control select{width:100%;padding:11px;border:1px solid #cfd4da;border-radius:8px;background:#fff;font-size:14px}
  .custom{margin-top:14px}.custom input{width:100%;padding:11px;border:1px solid #cfd4da;border-radius:8px;font-size:14px}.hint{font-size:12px;color:#777;margin-top:6px}
  .status{font-size:13px;color:#666;margin-top:12px}.error{background:#fff1f1;border:1px solid #ffcaca;color:#a40000;padding:11px;border-radius:8px;margin-bottom:12px}.result{padding:16px 0;border-bottom:1px solid #eceff2}.result:last-child{border-bottom:0}.result h3{font-size:17px;line-height:1.5;margin:0 0 6px}.result h3 a{color:#1267b1;text-decoration:none}.result h3 a:hover{text-decoration:underline}.meta{font-size:12px;color:#666;margin-bottom:7px}.desc{font-size:14px;line-height:1.65;color:#444}.empty{color:#777;text-align:center;padding:28px}.badge{display:inline-block;background:#eef3f8;color:#445;padding:3px 7px;border-radius:999px;margin-right:6px}
  .sites{font-size:12px;color:#666;line-height:1.7}.small{font-size:12px;color:#777}.loading{display:none;margin-top:10px;color:#555}
  @media(max-width:700px){.searchrow{flex-direction:column}.controls{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>食品メディア横断検索</h1>
  <p class="lead">キーワード1つで、食品・飲食・トレンド系メディアを横断検索します。</p>

  <section class="panel">
    <div class="searchrow">
      <input id="query" type="text" placeholder="例：エビカツ、白ワイン、北海道スイーツ" autocomplete="off">
      <button id="searchBtn" class="btn">検索</button>
    </div>
    <div class="controls">
      <div class="control">
        <label for="sort">並び順</label>
        <select id="sort">
          <option value="relevance">関連度順</option>
          <option value="newest">新しい順</option>
        </select>
      </div>
      <div class="control">
        <label for="freshness">期間指定</label>
        <select id="freshness">
          <option value="all">指定なし（すべて）</option>
          <option value="pd">過去24時間</option>
          <option value="pw">過去7日間</option>
          <option value="pm">過去30日間</option>
          <option value="py">過去1年間</option>
        </select>
      </div>
    </div>
    <div class="custom">
      <label class="small" for="customDomains">追加したいサイト（任意）</label>
      <input id="customDomains" type="text" placeholder="例：company.co.jp, example.com">
      <div class="hint">ドメインをカンマ区切りで入力すると、そのサイトも今回の検索対象に追加します。</div>
    </div>
    <div id="loading" class="loading">検索中です……</div>
    <div id="status" class="status"></div>
  </section>

  <section class="panel">
    <div id="message" class="empty">キーワードを入力して検索してください。</div>
    <div id="results"></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const query = $('query'), sort = $('sort'), freshness = $('freshness'), customDomains = $('customDomains');
const searchBtn = $('searchBtn'), loading = $('loading'), status = $('status'), message = $('message'), results = $('results');

function esc(s){return String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function fmtDate(iso){
  if(!iso) return '日付情報なし';
  const d=new Date(iso); if(Number.isNaN(d.getTime())) return '日付情報なし';
  return d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function customList(){
  return customDomains.value.split(',').map(x=>x.trim()).filter(Boolean).map(domain=>({name:domain,domain}));
}

async function search(){
  const q=query.value.trim();
  if(!q){ message.textContent='検索キーワードを入力してください。'; results.innerHTML=''; return; }
  searchBtn.disabled=true; loading.style.display='block'; status.textContent=''; message.textContent=''; results.innerHTML='';
  try{
    const res=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,sort:sort.value,freshness:freshness.value,customDomains:customList()})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'検索に失敗しました。');
    status.textContent=`${data.results.length}件｜${data.searchedSites}サイトを検索｜API使用 ${data.apiRequestsUsed}/${data.maxApiRequests}`;
    if(data.errors?.length){
      status.textContent += `｜一部サイトでエラー ${data.errors.length}件`;
    }
    if(!data.results.length){ message.textContent='該当する検索結果がありませんでした。'; return; }
    results.innerHTML=data.results.map(r=>`<article class="result">
      <h3><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a></h3>
      <div class="meta"><span class="badge">${esc(r.siteName)}</span>${r.publishedDate?esc(fmtDate(r.publishedDate)):''}${r.pageAge?'（'+esc(r.pageAge)+'）':''}</div>
      <div class="desc">${esc(r.description)}</div>
    </article>`).join('');
  }catch(e){
    message.innerHTML='<div class="error">'+esc(e.message)+'</div>';
  }finally{
    searchBtn.disabled=false; loading.style.display='none';
  }
}
searchBtn.addEventListener('click',search);
query.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
</script>
</body>
</html>
